[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyEDW"
version = "0.1.0"
description = "Exo-Daisy World: a stochastic Daisy World and its information architecture."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Damian R. Sowinski", email = "drsowinski@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "matplotlib",
]

[project.optional-dependencies]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/EternalTime/pyEDW"
Documentation = "https://damiansowinski.com/pyEDW/"

[tool.setuptools.packages.find]
include = ["pyEDW*"]
